[package]
name = "research-dome"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
axum = { version = "0.8.9", default-features = false }
http-body-util = "0.1.5"
research-dome-core = { version = "1.0.0", path = "../core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.4", features = [] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-opener = "2.7.2"
tauri-plugin-single-instance = "2.5.4"
tower = "0.5.3"

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[lib]
name = "research_dome_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
