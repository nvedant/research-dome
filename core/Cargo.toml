[package]
name = "research-dome-core"
description = "Research Dome core: SQLite database, local file storage, PDF export and LaTeX build, served over a private loopback API"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "research_dome_core"
path = "src/lib.rs"

[[bin]]
name = "dome-server"
path = "src/bin/dome_server.rs"

[dependencies]
axum = { version = "0.8.9", features = ["multipart", "macros"] }
chrono = "0.4.45"
http-body-util = "0.1.5"
lopdf = "0.45.0"
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "fs", "process", "time", "net", "sync", "signal"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["cors"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.28.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
